<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MC与PVZ资源工作台：查找、预览、复制来源与取用原件"><title>方块与花园 · MC × PVZ</title><link rel="stylesheet" href="style.css"><script src="vendor/spine-webgl.min.js"></script><script type="module" src="app.js"></script></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><div><h1>方块与花园 <span>MC × PVZ</span></h1><p>资源预览与取用</p></div></div><div class="library-stat" id="libraryStat">读取资源目录…</div><span id="modeLabel" class="mode-badge">本机按需</span><button id="rescan" class="quiet">重扫资源</button></header>
<main class="workspace"><button id="openGroups" class="mobile-groups">☰ 分组</button>
 <aside id="groupSidebar" class="library-panel panel" aria-label="资源分组"></aside>
 <section class="browser-panel panel" aria-label="资源浏览">
  <div class="path-bar"><button id="parentGroup" aria-label="上一级分组">↑</button><nav id="breadcrumbs" aria-label="当前位置"></nav><span id="currentGroupCount"></span></div><nav id="childGroups" aria-label="直接子组"></nav>
  <div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜名称、用途或路径…" aria-label="搜索资源" autocomplete="off"><kbd>/</kbd></label><button id="reset" class="quiet">重置</button></div>
  <div class="quick-row" aria-label="常用查找"><span>常用</span><button data-query="豌豆">豌豆射手</button><button data-query="向日葵">向日葵</button><button data-query="僵尸">僵尸</button><button data-query="基岩">基岩</button><button data-query="黑曜石">黑曜石</button><button data-query="熔炉">熔炉</button></div>
  <div class="view-tools"><div><strong id="resultCount">正在整理目录…</strong><span id="viewHint"></span></div><div class="view-actions"><select id="typeFilter" aria-label="资源类型"></select><button id="playGrid" aria-pressed="true">Ⅱ 列表动画</button><label class="density-label"><span class="sr-only">预览密度</span><select id="density" aria-label="预览密度"><option value="comfortable">舒适</option><option value="compact">密集</option></select></label><button id="background" title="切换预览背景">◐ 背景</button></div></div>
  <section class="selection-panel" aria-label="多选与批量下载"><div class="selection-top"><strong id="selectionStatus">已选0项</strong><span id="batchEstimate"></span></div><div class="selection-actions"><button id="selectPage">全选本页</button><button id="selectResults">全选当前结果</button><button id="selectGroup">选整组含子级</button><button id="showSelection">查看已选</button><button id="clearSelection">清空选择</button><button id="batchDownload" class="primary" disabled>↓ 下载所选</button><button id="batchStream" hidden disabled>流式保存</button><button id="cancelBatch" hidden>取消下载</button></div><p id="batchStatus" role="status"></p></section>
  <div id="gridWrap"><div id="grid" class="resource-grid" aria-label="资源预览列表"></div><div id="empty" hidden><span>⌕</span><h2>没有找到匹配资源</h2><p>试试更短的词，或重置筛选条件。</p><button id="emptyReset">重置筛选</button></div></div>
  <footer class="pager"><span id="pageRange">—</span><div><button id="previous" aria-label="上一页">←</button><span id="pageInfo">1 / 1</span><button id="next" aria-label="下一页">→</button></div><span id="loadStatus" role="status">后台准备预览</span></footer>
 </section>
 <aside id="detail" class="detail-panel panel" aria-label="资源详情"><div class="section-heading"><span>预览与取用</span><button id="closeDetail" class="quiet" aria-label="关闭详情">×</button></div><div id="detailEmpty"><div class="empty-symbol">↖</div><h2>选一份资源，细看。</h2><p>看动作、查原件，<br>直接复制来源或下载。</p><div class="legend"><span class="mc-dot"></span>MC 方块与物品<br><span class="pvz-dot"></span>PVZ 角色与场景</div></div>
  <div id="detailBody" hidden><div class="detail-heading"><span id="detailBadge" class="badge"></span><h2 id="detailName"></h2></div><div class="preview-toolbar"><span id="viewGesture" class="tiny"></span><button id="resetView" class="quiet" hidden>↺ 复位视角</button></div><div id="detailPreview" class="preview detail-preview"></div><p id="detailStatus" class="detail-status" role="status"></p>
   <div id="animationControls" class="animation-controls" hidden><div class="playback"><button id="detailPlay" aria-label="播放或暂停详情">Ⅱ</button><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="动画时间"><span id="timeLabel">0.0 / 0.0s</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><div class="animation-selects"><select id="animation" aria-label="选择动画" hidden></select><select id="skin" aria-label="选择皮肤" hidden></select></div></div>
   <div id="skinGroups" class="skin-groups" hidden></div><div id="resourceMeta" class="resource-meta"></div><div id="specialDetails"></div><label id="fileSelectLabel" class="file-selector" hidden>取用文件<select id="fileSelect" aria-label="选择取用文件"></select></label><label class="path-label">原库相对路径<input id="sourcePath" readonly aria-label="原库相对路径"></label><div class="copy-actions"><button id="copyRelative">复制相对路径</button><button id="copyFull">复制本机路径</button></div><div class="download-actions"><button id="download" class="primary">↓ 下载原件</button><button id="downloadBundle" class="bundle" hidden>↓ 下载整套</button></div><details id="definitionDetails" hidden><summary>查看源定义</summary><pre id="definition"></pre></details><p id="actionStatus" class="action-status" role="status"></p>
  </div>
 </aside>
</main><dialog id="groupDialog"><div class="dialog-title"><h2>我的分组</h2><button id="groupDialogClose" aria-label="关闭分组管理">×</button></div><p>本地合集引用资源，不移动原件；导入配方会替换本库分组。</p><label>分组名称<input id="groupName" maxlength="120" autocomplete="off"></label><label>新组的父级<select id="groupParent"></select></label><button id="saveGroup" class="primary">创建子组</button><hr><label>管理已有分组<select id="manageGroup"></select></label><div class="dialog-actions"><button id="renameGroup">重命名</button><button id="deleteGroup">移除该组及子组</button><button id="addToGroup">加入当前已选</button><button id="removeFromGroup">从本组直接成员移出</button></div><div class="dialog-actions"><button id="exportGroups">导出分组配方</button><label class="file-button">导入分组配方<input id="importGroups" type="file" accept="application/json,.json"></label></div><p id="groupDialogStatus" role="status"></p></dialog><div id="toast" role="status" hidden></div><noscript>此工作台需要启用JavaScript。原件仍保存在原资源目录。</noscript>
</body></html>
