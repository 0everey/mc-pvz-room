<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MC与PVZ资源工作台：查找、预览、复制来源与取用原件"><title>方块与花园 · 游戏资源</title><link rel="stylesheet" href="style.css"><script src="vendor/spine-webgl.min.js"></script><script type="module" src="app.js"></script></head>
<body class="workspace-ui-compact">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><div><h1>方块与花园 <span>我的世界 × 植物大战僵尸</span></h1></div></div><div class="library-stat" id="libraryStat">读取资源目录…</div><span id="modeLabel" class="mode-badge">读取目录…</span><button id="rescan" class="quiet" hidden>重扫资源</button></header>
<main class="workspace">
 <aside id="groupSidebar" class="library-panel panel" aria-label="资源分组"></aside>
 <section class="browser-panel panel" aria-label="资源浏览">
  <div class="path-bar"><button id="openGroups" class="mobile-groups">☰ 分组</button><button id="parentGroup" aria-label="上一级分组">↑</button><nav id="breadcrumbs" aria-label="当前位置"></nav><span id="currentGroupCount"></span><button id="openExport" class="scope-download">↓ 分类下载</button></div><nav id="childGroups" aria-label="直接子组"></nav>
  <div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜名称、用途或路径…" aria-label="搜索资源" autocomplete="off"><kbd>/</kbd></label><select id="typeFilter" aria-label="资源类型"></select><button id="reset" class="quiet">重置</button></div>

  <div class="browse-toolbar" aria-label="资源操作"><div class="results-info"><strong id="resultCount">读取目录…</strong><span id="viewHint" hidden></span><strong id="selectionStatus"></strong><span id="batchEstimate"></span></div><div class="toolbar-actions selection-actions"><button id="selectPage">选本页</button><button id="batchDownload" class="primary" disabled>↓ 下载所选</button><button id="cancelBatch" hidden>取消下载</button><details class="tool-menu display-menu"><summary>显示</summary><div class="tool-menu-items"><label class="density-label">资源格大小 <output id="densityValue">中 · 平衡阅读</output><select id="density" aria-label="资源格大小"><option value="small">小 · 手机多看</option><option value="medium" selected>中 · 平衡阅读</option><option value="large">大 · 细看主体</option></select></label><button id="playGrid" aria-pressed="true">Ⅱ 列表动画</button><button id="background" title="切换预览背景">◐ 预览背景</button></div></details><details class="tool-menu selection-more"><summary>更多</summary><div class="tool-menu-items"><button id="selectResults">选择当前搜索结果</button><button id="selectGroup">选择整组含子级</button><button id="showSelection">查看已选</button><button id="clearSelection">清空选择</button><button id="batchStream" hidden disabled>流式保存</button></div></details></div><p id="batchStatus" role="status"></p></div>
  <div id="gridWrap"><div id="grid" class="resource-grid" aria-label="资源预览列表"></div><div id="empty" hidden><span>⌕</span><h2>没有找到匹配资源</h2><p>试试更短的词，或重置筛选条件。</p><button id="emptyReset">重置筛选</button></div></div>
  <footer class="pager"><span id="pageRange">—</span><div><button id="previous" aria-label="上一页">←</button><span id="pageInfo">1 / 1</span><button id="next" aria-label="下一页">→</button></div><span id="loadStatus" role="status">后台准备预览</span></footer>
 </section>

</main><div id="detailBackdrop" class="detail-backdrop" hidden></div> <dialog id="detail" aria-modal="true" aria-labelledby="detailName" class="detail-panel panel" aria-label="资源详情"><div class="section-heading"><span>预览与取用</span><button id="closeDetail" class="quiet" aria-label="关闭详情">×</button></div><div id="detailEmpty"><div class="empty-symbol">↖</div><h2>选一份资源，细看。</h2><p>看动作、查原件，<br>直接复制来源或下载。</p><div class="legend"><span class="mc-dot"></span>MC 方块与物品<br><span class="pvz-dot"></span>PVZ 角色与场景</div></div>
  <div id="detailBody" hidden><section class="detail-stage"><div class="detail-heading"><span id="detailBadge" class="badge"></span><h2 id="detailName"></h2></div><div class="preview-toolbar"><span id="viewGesture" class="tiny"></span><div id="viewButtons" class="view-buttons" hidden><button id="zoomOut" class="quiet" aria-label="缩小预览" disabled>−</button><button id="zoomIn" class="quiet" aria-label="放大预览" disabled>＋</button><button id="resetView" class="quiet" hidden>↺ 复位视角</button></div></div><div id="detailPreview" class="preview detail-preview"></div><p id="detailStatus" class="detail-status" role="status"></p>
   <div id="animationControls" class="animation-controls" hidden><div class="playback"><button id="detailPlay" aria-label="播放或暂停详情">Ⅱ</button><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="动画时间"><span id="timeLabel">0.0 / 0.0s</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><div class="animation-selects"><select id="animation" aria-label="选择动画" hidden></select><select id="skin" aria-label="选择皮肤" hidden></select></div></div>
   <div id="skinGroups" class="skin-groups" hidden></div></section><section class="detail-info"><div id="resourceMeta" class="resource-meta"></div><div id="specialDetails"></div><label id="fileSelectLabel" class="file-selector" hidden>取用文件<select id="fileSelect" aria-label="选择取用文件"></select></label><label class="path-label">原库相对路径<input id="sourcePath" readonly aria-label="原库相对路径"></label><div class="copy-actions"><button id="copyRelative">复制相对路径</button><button id="copyFull">复制本机路径</button></div><div class="download-actions"><button id="download" class="primary">↓ 下载原件</button><button id="downloadBundle" class="bundle" hidden>↓ 下载整套</button></div><details id="definitionDetails" hidden><summary>查看源定义</summary><pre id="definition"></pre></details><p id="actionStatus" class="action-status" role="status"></p>
  </section></div>
 </dialog><dialog id="groupDialog"><div class="dialog-title"><h2>我的分组</h2><button id="groupDialogClose" aria-label="关闭分组管理">×</button></div><p>本地合集引用资源，不移动原件；导入配方会替换本库分组。</p><label>分组名称<input id="groupName" maxlength="120" autocomplete="off"></label><label>新组的父级<select id="groupParent"></select></label><button id="saveGroup" class="primary">创建子组</button><hr><label>管理已有分组<select id="manageGroup"></select></label><div class="dialog-actions"><button id="renameGroup">重命名</button><button id="deleteGroup">移除该组及子组</button><button id="addToGroup">加入当前已选</button><button id="removeFromGroup">从本组直接成员移出</button></div><div class="dialog-actions"><button id="exportGroups">导出分组配方</button><label class="file-button">导入分组配方<input id="importGroups" type="file" accept="application/json,.json"></label></div><p id="groupDialogStatus" role="status"></p></dialog><dialog id="exportDialog" aria-labelledby="exportTitle"><div class="dialog-title"><h2 id="exportTitle">按范围下载</h2><button id="closeExport" aria-label="关闭分类下载">×</button></div><fieldset id="exportRanges"><legend>下载范围</legend><label><input type="radio" name="exportScope" value="category" checked>当前分类 · 含子分类</label><label><input type="radio" name="exportScope" value="results">当前筛选结果 · 全部页</label><label><input type="radio" name="exportScope" value="selection">已有选集</label></fieldset><p id="exportPath" class="export-path"></p><p id="exportSummary"></p><p id="exportHint" class="tiny">保留原文件名、目录和依赖；附中文使用说明。</p><div class="export-main"><button id="exportDownload" class="primary">下载当前分类</button><button id="exportCancel" hidden>取消下载</button></div><p id="exportProgress" role="status"></p><details id="exportExtras"><summary>分享与交接</summary><div class="export-extra-actions"><button id="exportLink">复制分类链接</button><button id="exportCopy">复制使用清单</button><button id="exportJSON">保存清单JSON</button></div><p id="exportShareHint" class="tiny"></p><textarea id="exportCopyFallback" aria-label="可复制的使用清单" readonly hidden></textarea></details><p id="exportActionStatus" role="status"></p></dialog><div id="toast" role="status" hidden></div><noscript>此工作台需要启用JavaScript。原件仍保存在原资源目录。</noscript>
</body></html>
